    <title>Theme</title>
    <link rel="stylesheet" href="./styles.css" />

  <body>
    <div class="page-bg"></div><div class="center-radiance"></div><div class="grain"></div>

          <div class="panel-card"><span>Theme</span><strong>Soft Mist</strong><em>当前使用中的浅色雾感主题</em></div>

      </div>
