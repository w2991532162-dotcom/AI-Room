      <div class="room-shell-wrap">
        <section class="room-shell">
          <div class="chat-panel">
            <div class="room-stamp">Room</div>
            <h1 class="room-title">失眠空间</h1>
            <p class="room-lead">这是一个偏安静、缓慢、适合深夜停留的房间，主打放低音量的对话与柔和回应。</p>
            <div class="chat-flow">
              <div class="bubble bubble-user">我已经很困了，但还是睡不着。</div>
              <div class="bubble bubble-ai">那今晚我们先不逼自己睡着。先让身体知道，这里是安全的、安静的、可以慢一点的。</div>
              <div class="bubble bubble-user">如果脑子一直转怎么办？</div>
              <div class="bubble bubble-ai">那就让它转，我们只负责把声音调低，不急着结束它。</div>
            </div>
          </div>
          <div class="info-panel">
            <h2>Room Status</h2>
            <div class="info-list">
              <div class="info-item"><strong>Mood</strong><span>Night / slow / quiet</span></div>
              <div class="info-item"><strong>Whisper</strong><span>这里允许人把没整理好的情绪先放下来。</span></div>
              <div class="info-item"><strong>Presence</strong><span>29 humans and 1 patient AI are awake.</span></div>
            </div>
          </div>
        </section>
