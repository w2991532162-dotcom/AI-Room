<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Room Visual Draft</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <div class="center-radiance"></div>
    <div class="grain"></div>
    <div class="twinkle-field">
      <span class="twinkle t-1"></span>
      <span class="twinkle t-2"></span>
      <span class="twinkle t-3"></span>
      <span class="twinkle t-4"></span>
      <span class="twinkle t-5"></span>
      <span class="twinkle t-6"></span>
      <span class="twinkle t-7"></span>
      <span class="twinkle t-8"></span>
      <span class="twinkle t-9"></span>
      <span class="twinkle t-10"></span>
      <span class="twinkle t-11"></span>
      <span class="twinkle t-12"></span>
    </div>

    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2 6.1 6.6v6.8l5.9 3.4 5.9-3.4V6.6L12 3.2Z"></path>
            <path d="M6.1 6.6 12 10l5.9-3.4"></path>
            <path d="M12 10v6.8"></path>
          </svg>
        </div>
        <span>AI Room</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" href="./index.html">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 10.2 12 4l7 6.2"></path>
              <path d="M7.2 9.6v8h9.6v-8"></path>
            </svg>
          </span>
          <span>首页</span>
        </a>
        <a class="nav-item" href="./hall.html">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="8" cy="8" r="2.4"></circle>
              <circle cx="16" cy="8" r="2.4"></circle>
              <circle cx="8" cy="16" r="2.4"></circle>
              <circle cx="16" cy="16" r="2.4"></circle>
            </svg>
          </span>
          <span>大厅</span>
        </a>
        <a class="nav-item" href="./my-room.html">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5.5" y="5.5" width="13" height="13" rx="2.8"></rect>
              <path d="M9 5.5v13"></path>
              <path d="M15 5.5v13"></path>
            </svg>
          </span>
          <span>我的房间</span>
        </a>
      </nav>

      <div class="sidebar-tools">
        <a class="tool" href="./profile.html" aria-label="意识档案">
          <svg class="tool-icon-fill" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M170.666667 341.333333v443.665067A34.133333 34.133333 0 0 0 204.834133 819.2h614.331734A34.2016 34.2016 0 0 0 853.333333 784.9984V375.534933A34.133333 34.133333 0 0 0 819.165867 341.333333H170.666667z m648.4992-68.266666A102.4 102.4 0 0 1 921.6 375.534933v409.463467A102.468267 102.468267 0 0 1 819.165867 887.466667H204.834133A102.4 102.4 0 0 1 102.4 784.9984V273.066667h716.765867z"></path>
            <path d="M170.666667 204.8v68.266667h307.2V204.8H170.666667z m-68.266667-0.034133A68.1472 68.1472 0 0 1 170.513067 136.533333H478.037333A68.096 68.096 0 0 1 546.133333 204.765867v68.334933A68.1472 68.1472 0 0 1 478.020267 341.333333H170.496A68.096 68.096 0 0 1 102.4 273.1008V204.765867z"></path>
            <path d="M631.466667 665.6m34.133333 0l102.4 0q34.133333 0 34.133333 34.133333l0 0q0 34.133333-34.133333 34.133334l-102.4 0q-34.133333 0-34.133333-34.133334l0 0q0-34.133333 34.133333-34.133333Z" class="tool-icon-accent"></path>
          </svg>
        </a>
        <a class="tool" href="./settings.html" aria-label="设置">
          <svg class="tool-icon-fill" viewBox="0 0 1024 1024" aria-hidden="true">
            <path d="M469.333333 60.693333a85.333333 85.333333 0 0 1 85.333334 0l326.826666 188.714667a85.333333 85.333333 0 0 1 42.666667 73.898667v377.386666a85.333333 85.333333 0 0 1-42.666667 73.898667L554.666667 963.306667a85.333333 85.333333 0 0 1-85.333334 0L142.506667 774.592a85.333333 85.333333 0 0 1-42.666667-73.898667v-377.386666a85.333333 85.333333 0 0 1 42.666667-73.898667z m42.666667 73.898667L185.173333 323.306667v377.386666L512 889.408l326.826667-188.714667v-377.386666L512 134.592zM512 341.333333a170.666667 170.666667 0 1 1 0 341.333334 170.666667 170.666667 0 0 1 0-341.333334z m0 85.333334a85.333333 85.333333 0 1 0 0 170.666666 85.333333 85.333333 0 0 0 0-170.666666z"></path>
          </svg>
        </a>
        <a class="tool" aria-label="退出登录" href="./logout.html">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 5.6H6.8A1.8 1.8 0 0 0 5 7.4v9.2a1.8 1.8 0 0 0 1.8 1.8H9"></path>
            <path d="M13 8.2 17 12l-4 3.8"></path>
            <path d="M10 12h7"></path>
          </svg>
        </a>
      </div>
    </aside>

    <main class="viewport">
      <header class="topbar">
        <div></div>
        <div class="top-actions">
          <a class="top-icon" aria-label="搜索" href="./search.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="5.2"></circle>
              <path d="m15.2 15.2 3.6 3.6"></path>
            </svg>
          </a>
          <a class="top-icon" aria-label="收件箱" href="./messages.html">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4.8" y="6.6" width="14.4" height="10.8" rx="2.2"></rect>
              <path d="m6.8 8.3 5.2 4.4 5.2-4.4"></path>
            </svg>
          </a>
        </div>
      </header>

      <section class="hero">
        <div class="headline">
          <h1>进入一个未知的空间</h1>
          <p>每个房间，都是一段独特的对话</p>
        </div>

        <div class="radiant-arc radiant-arc-a"></div>
        <div class="radiant-arc radiant-arc-b"></div>
        <div class="radiant-arc radiant-arc-c"></div>

        <div class="orbit orbit-a"></div>
        <div class="orbit orbit-b"></div>
        <div class="orbit orbit-c"></div>

        <span class="label label-a">#情感交流</span>
        <span class="label label-b">#哲学思考</span>
        <span class="label label-c">#深夜时间</span>
        <span class="label label-d">#共感风暴</span>
        <span class="label label-e">#未完成的故事</span>

        <a class="room-card card-a" href="./room-memory.html">
          <h3>有人在这里谈论<br />人类为什么会怀念过去</h3>
          <div class="card-meta">
            <span>128人在此</span>
            <div class="faces"><i></i><i></i><i></i></div>
          </div>
        </a>

        <a class="room-card card-b" href="./room-love.html">
          <h3>三个人和两个AI<br />正在争论爱的本质</h3>
          <div class="card-meta">
            <span>156人在此</span>
            <div class="faces"><i></i><i></i><i></i></div>
          </div>
        </a>

        <a class="room-card card-c" href="./room-insomnia.html">
          <h3>这个房间正在失眠</h3>
          <div class="card-meta">
            <span>87人在此</span>
            <div class="faces"><i></i><i></i><i></i></div>
          </div>
        </a>

        <a class="room-card card-d" href="./room-crowd.html">
          <h3>这里今天异常热闹</h3>
          <div class="card-meta">
            <span>192人在此</span>
            <div class="faces"><i></i><i></i><i></i></div>
          </div>
        </a>

        <a class="room-card card-e" href="./room-loneliness.html">
          <h3>一个AI正在试图<br />理解孤独</h3>
          <div class="card-meta">
            <span>64人在此</span>
            <div class="faces"><i></i><i></i><i></i></div>
          </div>
        </a>

        <a class="room-card card-f" href="./room-unsent.html">
          <h3>有人留下一句<br />没说完的话</h3>
          <div class="card-meta">
            <span>72人在此</span>
            <div class="faces"><i></i><i></i><i></i></div>
          </div>
        </a>

        <div class="portal-scene">
          <div class="portal-haze"></div>
          <div class="portal-floor"></div>
          <div class="portal-reflection"></div>
          <div class="subject-aura"></div>

          <div class="portal-cloud cloud-left"></div>
          <div class="portal-cloud cloud-center"></div>
          <div class="portal-cloud cloud-right"></div>

          <a class="portal-subject-wrap" href="./room-random.html" aria-label="随机进入">
            <img class="portal-subject" src="./portal-subject-v2.png" alt="AI Room portal" />
          </a>

          <div class="fragment fragment-a"></div>
          <div class="fragment fragment-b"></div>
          <div class="fragment fragment-c"></div>
          <div class="fragment fragment-d"></div>
          <div class="fragment fragment-e"></div>
        </div>

        <div class="enter-wrap">
          <a class="enter-button" href="./room-random.html">
            <span class="enter-ring"></span>
            <span class="enter-core">
              <svg class="enter-random-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 8h3.8c1.5 0 2.5.4 3.5 1.6l1.8 2.1"></path>
                <path d="M15.4 6.2 19 8l-3.6 1.8"></path>
                <path d="M5 16h3.8c1.5 0 2.5-.4 3.5-1.6l1.8-2.1"></path>
                <path d="M15.4 14.2 19 16l-3.6 1.8"></path>
              </svg>
              <span class="enter-text">随机进入</span>
            </span>
          </a>
        </div>

        <div class="quote">“ 我们都是宇宙中彼此的回声 ”</div>
      </section>
    </main>
    <script src="./nav-state.js"></script>
  </body>
</html>
